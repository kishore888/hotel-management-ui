<div class="content-wrapper">
  <section class="content">
    <div class="box box-primary">
      <div class="box-header with-border">
        <h3 class="box-title">Payment Account</h3>
      </div>

      <form #paymentAccountForm="ngForm" (ngSubmit)="onSubmit(paymentAccountForm)">
        <div class="box-body">
          <div class="row">
            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="name">Account Name</label>
              <input type="text" class="form-control" id="name" name="name" [(ngModel)]="paymentAccount.name" placeholder="e.g. Front Desk Cash" required>
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="code">Account Code</label>
              <input type="text" class="form-control" id="code" name="code" [(ngModel)]="paymentAccount.code" placeholder="e.g. CASH001" required>
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="bankName">Bank Name</label>
              <input type="text" class="form-control" id="bankName" name="bankName" [(ngModel)]="paymentAccount.bankName" placeholder="e.g. HDFC Bank">
            </div>
          </div>

          <div class="row">
            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="billCount">Bill Count</label>
              <input type="number" class="form-control" id="billCount" name="billCount" [(ngModel)]="paymentAccount.billCount" placeholder="0" min="0">
            </div>

            <div class="form-group col-lg-8 col-md-8 col-sm-12">
              <label for="hotelPaymentGateway">Hotel Payment Gateway</label>
              <select class="form-control" id="hotelPaymentGateway" name="hotelPaymentGateway" [(ngModel)]="paymentAccount.hotelPaymentGateway">
                <option [ngValue]="null">Select Gateway</option>
                <option *ngFor="let gateway of hotelPaymentGateways" [ngValue]="gateway">
                  {{ gateway.paymentGateway?.paymentGatewayName || gateway.merchantId }}
                </option>
              </select>
            </div>
          </div>
        </div>

        <div class="box-footer">
          <button type="submit" class="btn btn-primary" [disabled]="paymentAccountForm.invalid || isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
        </div>
      </form>
    </div>
  </section>
</div>
