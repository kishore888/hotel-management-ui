<div class="content-wrapper">
  <section class="content">
    <div class="box box-primary">
      <div class="box-header with-border">
        <h3 class="box-title">Payment Gateway</h3>
      </div>

      <form #gatewayForm="ngForm" (ngSubmit)="onSubmit(gatewayForm)">
        <div class="box-body">
          <div class="row">
            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="paymentGatewayName">Gateway Name</label>
              <input type="text" class="form-control" id="paymentGatewayName" name="paymentGatewayName" [(ngModel)]="gateway.paymentGatewayName" placeholder="e.g. Razorpay" required>
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="baseUrl">Base URL</label>
              <input type="text" class="form-control" id="baseUrl" name="baseUrl" [(ngModel)]="gateway.baseUrl" placeholder="https://api.example.com" required>
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="isActive">Active</label>
              <select class="form-control" id="isActive" name="isActive" [(ngModel)]="gateway.isActive">
                <option [ngValue]="true">Yes</option>
                <option [ngValue]="false">No</option>
              </select>
            </div>
          </div>

          <div class="row">
            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="merchantId">Merchant ID</label>
              <input type="text" class="form-control" id="merchantId" name="merchantId" [(ngModel)]="gateway.merchantId" placeholder="Merchant ID">
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="merchantKey">Merchant Key</label>
              <input type="text" class="form-control" id="merchantKey" name="merchantKey" [(ngModel)]="gateway.merchantKey" placeholder="Merchant Key">
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="salt">Salt</label>
              <input type="text" class="form-control" id="salt" name="salt" [(ngModel)]="gateway.salt" placeholder="Salt">
            </div>
          </div>
        </div>

        <div class="box-footer">
          <button type="submit" class="btn btn-primary" [disabled]="gatewayForm.invalid || isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
        </div>
      </form>
    </div>
  </section>
</div>
