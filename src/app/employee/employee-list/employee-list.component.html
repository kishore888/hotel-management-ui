<!-- Filter Bar -->
<div class="box-body pb-0">
  <div class="row g-2 align-items-end">
    <div class="col-12 col-sm-3 col-md-2">
      <label class="form-label small fw-semibold mb-1">Gender</label>
      <select class="form-select form-select-sm" [(ngModel)]="filterGender" (change)="applyFilters()">
        <option value="">All</option>
        <option *ngFor="let g of genders" [value]="g">{{ g }}</option>
      </select>
    </div>
    <div class="col-12 col-sm-3 col-md-2">
      <label class="form-label small fw-semibold mb-1">Role</label>
      <select class="form-select form-select-sm" [(ngModel)]="filterRole" (change)="applyFilters()">
        <option value="">All</option>
        <option *ngFor="let r of roles" [value]="r">{{ r }}</option>
      </select>
    </div>
    <div class="col-12 col-sm-3 col-md-2">
      <label class="form-label small fw-semibold mb-1">Status</label>
      <select class="form-select form-select-sm" [(ngModel)]="filterStatus" (change)="applyFilters()">
        <option value="">All</option>
        <option *ngFor="let st of statuses" [value]="st">{{ st }}</option>
      </select>
    </div>
    <div class="col-12 col-md-2 d-flex align-items-end">
      <button class="btn btn-outline-secondary btn-sm w-100" (click)="clearFilters()">Clear</button>
    </div>
  </div>
</div>

<!-- Employee Table -->
<div class="box-body table-responsive">
  <table class="table table-striped table-bordered table-sm row-border hover" id="employeeTable">
    <thead>
      <tr>
        <th>S.No.</th>
        <th>Name</th>
        <th>Phone</th>
        <th>Role</th>
        <th>Department</th>
        <th>Salary (₹)</th>
        <th>Joining Date</th>
        <th>Status</th>
        <th>Gender</th>
        <th>Email</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div class="box-footer">
  <input type="button" class="btn btn-warning btn-sm" value="Back" onclick="history.go(-1);" />
</div>

<!-- Delete Confirm Modal -->
<ng-template #deleteModal let-modal>
  <div class="modal-header">
    <h5 class="modal-title text-danger">Confirm Delete</h5>
    <button type="button" class="btn-close" (click)="modal.dismiss()"></button>
  </div>
  <div class="modal-body">
    <p>Are you sure you want to delete
      <strong>{{ selectedEmployee?.prefix }} {{ selectedEmployee?.firstName }} {{ selectedEmployee?.lastName }}</strong>?
    </p>
    <p class="text-muted small mb-0">This action cannot be undone.</p>
  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary btn-sm" (click)="modal.dismiss()">Cancel</button>
    <button type="button" class="btn btn-danger btn-sm" (click)="confirmDelete(modal)">Delete</button>
  </div>
</ng-template>
