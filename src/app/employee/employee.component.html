<div class="content-wrapper">
  <section class="content">
    <div class="box box-primary">

      <!-- Box Header -->
      <div class="box-header with-border">
        <h3 class="box-title">Employee Management</h3>
      </div>

      <!-- Alerts -->
      <div class="box-body pb-0">
        <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show py-2" role="alert">
          {{ successMessage }}
          <button type="button" class="btn-close" (click)="successMessage=''"></button>
        </div>
      </div>

      <!-- Nav Tabs -->
      <div class="box-body pb-0">
        <ul class="nav nav-tabs" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link" [class.active]="activeTab === 'create'"
              (click)="openAddForm()" type="button" role="tab">
              {{ selectedEmployee ? 'Edit Employee' : 'Create Employee' }}
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" [class.active]="activeTab === 'list'"
              (click)="activeTab='list'" type="button" role="tab">
              Employee List
            </button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" [class.active]="activeTab === 'schedule'"
              (click)="activeTab='schedule'" type="button" role="tab">
              Shift Schedule
            </button>
          </li>
        </ul>
      </div>

      <!-- TAB 1: CREATE / EDIT — destroyed on hide so form always resets -->
      <app-employee-form
        *ngIf="activeTab === 'create'"
        [employee]="selectedEmployee"
        [hotel]="hotel"
        (saved)="onFormSaved($event)"
        (cancelled)="onFormCancelled()">
      </app-employee-form>

      <!-- TAB 2: LIST — kept in DOM with d-none to preserve DataTable state -->
      <div [class.d-none]="activeTab !== 'list'">
        <app-employee-list
          (editEmployee)="onEditEmployee($event)"
          (employeeDeleted)="onEmployeeDeleted($event)">
        </app-employee-list>
      </div>

      <!-- TAB 3: SHIFT SCHEDULE -->
      <app-employee-shift-schedule
        *ngIf="activeTab === 'schedule'"
        [employees]="employeeList">
      </app-employee-shift-schedule>

    </div>
  </section>
</div>
