<div class="content-wrapper">
  <section class="content">
    <div class="box box-primary">
      <div class="box-header with-border">
        <h3 class="box-title">Hotel Plan</h3>
      </div>

      <form #planForm="ngForm" (ngSubmit)="onSubmit(planForm)">
        <div class="box-body">
          <div class="row">
            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="planName">Plan Name</label>
              <input type="text" class="form-control" id="planName" name="planName" [(ngModel)]="plan.planName" placeholder="e.g. Deluxe" required>
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-6">
              <label for="planCode">Plan Code</label>
              <input type="text" class="form-control" id="planCode" name="planCode" [(ngModel)]="plan.planCode" placeholder="e.g. DLX" required>
            </div>

            <div class="form-group col-lg-4 col-md-4 col-sm-12">
              <label for="planDescription">Description</label>
              <textarea class="form-control" id="planDescription" name="planDescription" [(ngModel)]="plan.planDescription" rows="3" placeholder="Plan description"></textarea>
            </div>
          </div>
        </div>

        <div class="box-footer">
          <button type="submit" class="btn btn-primary" [disabled]="planForm.invalid || isSubmitting">{{ isSubmitting ? 'Saving...' : 'Save' }}</button>
        </div>
      </form>
    </div>
  </section>
</div>
