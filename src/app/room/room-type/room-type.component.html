<div class="content-wrapper">
    <section class="content">
<!-- left column -->
<!--         <div class="col-md-12"> -->
          <!-- general form elements -->
          <div class="box box-primary">
            <div class="box-header with-border">
              <h3 class="box-title">Room Type</h3>
            </div>
            <!-- /.box-header -->
            <!-- form start -->
            <!-- <form role="form" id="" name="" action="${pageContext.request.contextPath}/roomType/create" method="POST"> -->
            <form #roomTypeForm="ngForm" (ngSubmit)="onSubmit(roomTypeForm)">
              <div class="box-body">
                <div class="row">
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="roomType">Room Type Name</label>
                    <input type="text" class="form-control" id="roomType" name="roomType" [(ngModel)]="roomType.roomType" placeholder="Room Type">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="roomTypeCode">Room Type Code</label>
                    <input type="text" class="form-control" id="roomTypeCode" name="roomTypeCode" [(ngModel)]="roomType.roomTypeCode" placeholder="e.g., STD, DLX, SUI">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="category">Category</label>
                    <input type="text" class="form-control" id="category" name="category" [(ngModel)]="roomType.category" placeholder="Luxury, Business, Economy">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-12 col-md-12 col-sm-12">
                    <label for="description">Description</label>
                    <textarea class="form-control" id="description" name="description" [(ngModel)]="roomType.description" rows="3" placeholder="Detailed description of amenities and features"></textarea>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-3 col-md-3 col-sm-3">
                    <label for="adultCapacity">Adult Capacity</label>
                    <input type="number" class="form-control" id="adultCapacity" name="adultCapacity" [(ngModel)]="roomType.adultCapacity" placeholder="0">
                    </div>
                    <div class="form-group col-lg-3 col-md-3 col-sm-3">
                    <label for="childCapacity">Child Capacity</label>
                    <input type="number" class="form-control" id="childCapacity" name="childCapacity" [(ngModel)]="roomType.childCapacity" placeholder="0">
                    </div>
                    <div class="form-group col-lg-3 col-md-3 col-sm-3">
                    <label for="roomSize">Room Size (sq ft)</label>
                    <input type="number" class="form-control" id="roomSize" name="roomSize" [(ngModel)]="roomType.roomSize" placeholder="0">
                    </div>
                    <div class="form-group col-lg-3 col-md-3 col-sm-3">
                    <label for="bedConfiguration">Bed Configuration</label>
                    <input type="text" class="form-control" id="bedConfiguration" name="bedConfiguration" [(ngModel)]="roomType.bedConfiguration" placeholder="e.g., 1 King, 2 Queen">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="baseTariff">Base Tariff</label>
                    <input type="number" class="form-control" id="baseTariff" name="baseTariff" [(ngModel)]="roomType.baseTariff" placeholder="0">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="weekendTariff">Weekend Tariff</label>
                    <input type="number" class="form-control" id="weekendTariff" name="weekendTariff" [(ngModel)]="roomType.weekendTariff" placeholder="0">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="currency">Currency</label>
                    <input type="text" class="form-control" id="currency" name="currency" [(ngModel)]="roomType.currency" placeholder="e.g., USD, INR">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="taxRate">Tax Rate (%)</label>
                    <input type="number" class="form-control" id="taxRate" name="taxRate" [(ngModel)]="roomType.taxRate" placeholder="0">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="minNights">Min Nights</label>
                    <input type="number" class="form-control" id="minNights" name="minNights" [(ngModel)]="roomType.minNights" placeholder="0">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="maxNights">Max Nights</label>
                    <input type="number" class="form-control" id="maxNights" name="maxNights" [(ngModel)]="roomType.maxNights" placeholder="0">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="viewType">View Type</label>
                    <input type="text" class="form-control" id="viewType" name="viewType" [(ngModel)]="roomType.viewType" placeholder="Ocean, City, Garden">
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="smokingPolicy">Smoking Policy</label>
                    <select class="form-control" id="smokingPolicy" name="smokingPolicy" [(ngModel)]="roomType.smokingPolicy">
                        <option value="">Select</option>
                        <option value="Non-Smoking">Non-Smoking</option>
                        <option value="Smoking">Smoking</option>
                    </select>
                    </div>
                    <div class="form-group col-lg-4 col-md-4 col-sm-4">
                    <label for="accessibility">Accessibility</label>
                    <select class="form-control" id="accessibility" name="accessibility" [(ngModel)]="roomType.accessibility">
                        <option value="">Select</option>
                        <option value="Standard">Standard</option>
                        <option value="ADA Compliant">ADA Compliant</option>
                    </select>
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-6 col-md-6 col-sm-6">
                    <label for="amenities">Amenities (comma separated)</label>
                    <input type="text" class="form-control" id="amenities" name="amenities" [(ngModel)]="amenitiesString" placeholder="WiFi, AC, TV, Minibar, Safe">
                    </div>
                    <div class="form-group col-lg-6 col-md-6 col-sm-6">
                    <label for="tags">Tags (comma separated)</label>
                    <input type="text" class="form-control" id="tags" name="tags" [(ngModel)]="tagsString" placeholder="tag1, tag2, tag3">
                    </div>
                </div>
                <div class="row">
                    <div class="form-group col-lg-6 col-md-6 col-sm-6">
                    <label for="images">Images (comma separated URLs)</label>
                    <input type="text" class="form-control" id="images" name="images" [(ngModel)]="imagesString" placeholder="url1, url2, url3">
                    </div>
                    <div class="form-group col-lg-3 col-md-3 col-sm-3">
                    <label for="roomTypeStatus">Status</label>
                    <select class="form-control" id="roomTypeStatus" name="roomTypeStatus" [(ngModel)]="roomType.roomTypeStatus">
                        <option value="">Select</option>
                        <option value="Active">Active</option>
                        <option value="Inactive">Inactive</option>
                    </select>
                    </div>
                    <div class="form-group col-lg-3 col-md-3 col-sm-3">
                    <label for="isActive">Is Active</label>
                    <select class="form-control" id="isActive" name="isActive" [(ngModel)]="roomType.isActive">
                        <option value="true">Yes</option>
                        <option value="false">No</option>
                    </select>
                    </div>
                </div>
              </div>
              <!-- /.box-body -->

              <div class="box-footer">
<!--                 <button type="submit" class="btn btn-primary">Submit</button> -->
                <input type="submit" class="btn btn-primary" value="Submit">
                <input type="button" class="btn btn-warning" value="Back" onclick="history.go(-1);"/>
              </div>
            </form>
          </div>
          <!-- /.box -->
          
<!--           </div> -->



        <!-- left column -->
<!--         <div class="col-md-12"> -->
          <!-- general form elements -->
          <div class="box box-primary">
            <div class="box-header with-border">
              <h3 class="box-title">Room Type List</h3>
              
              <button type="button" class="btn btn-success" data-role="button" data-toggle="modal" data-target="#importRoomsExcel">Import Rooms Excel</button>
              
              
            </div>
            <!-- /.box-header -->
            <!-- form start -->
              <div class="box-body table-responsive">
				<!-- <table id="roomList" class="table table-hover table-bordered table-striped"> -->
                <!-- <table id="roomList" datatable  [dtOptions]="dtOptions" class="row-border hover"> -->
                <table class="table table-striped table-bordered table-sm row-border hover" id="roomTypeList">
	                <thead>
		                <tr>
		                  <th>S.No.</th>
		                  <th>Room Type</th>
		                  <th>Tariff</th>
		                  <th>Status</th>
		                  <th>Actions</th>
		                </tr>
	                </thead>
	                <tbody>
                        <!-- <c:forEach items="${roomList}" var="room" varStatus="status"> -->
			                <tr *ngFor="let roomType of roomTypeList; let count = index">
			                  <td>{{count}}</td>
			                  <td>{{roomType.roomType}}</td>
			                  <td>{{roomType.roomTypeTariff}}</td>
                              <td>{{roomType.roomTypeStatus}}</td>
			                  <td>
                          <!-- <button type="button" (click)="bookingRoom($event)" class="btn btn-success" id="open-book-modal" >Book</button>   -->
                          <!-- <button type="button" *ngIf="hasPrivilege('ADD_ROOM')" (click)="addRoom(roomType)" class="btn btn-success" id="open-book-modal" ><mat-icon>edit</mat-icon></button>  -->
                          
                          
                          <!-- <button type="button" (click)="openBookingRoom(content)" class="btn btn-success" id="open-book-modal">Book</button>   -->
                           
			                    <!-- <a href="reservation/bookRoom?roomIds=${room.roomId}" role="button" class="btn btn-warning">Book</a>
			                    <a href="room/create?roomId=${room.roomId}" role="button" class="btn btn-success"><i class="fa fa-edit"></i></a> 
			                  	<button type="button" (click)="bookingRoom($event)" class="btn btn-success" data-role="button" data-toggle="modal" data-target="#paymentModel" 
			                  	 id="book-button" data-roomId="{{room.roomId}}" data-roomno="{{room.roomNumber}}" data-roomcharges="{{room.roomCharges}}">Book</button>  -->
                           <!-- <button type="button" (click)="bookingRoom($event)" class="btn btn-success" data-role="button" data-toggle="modal" data-target="#paymentModel" 
			                  	 id="book-button" data-roomId="{{room.roomId}}" data-roomno="{{room.roomNumber}}" data-roomcharges="{{room.roomCharges}}">Book</button>  -->
			                  
			                  </td>
			                </tr>
		                <!-- </c:forEach> -->
		            </tbody>
		        </table>

              </div>
              <!-- /.box-body -->

              <div class="box-footer">
                <input type="button" class="btn btn-warning" value="Back" onclick="history.go(-1);"/>
              </div>
          </div>
          <!-- /.box -->
          
<!--           </div> -->




<!-- Modal -->
  <div class="modal fade" id="importRoomsExcel" role="dialog" tabindex="-1" aria-labelledby="Import Rooms Excel" aria-hidden="true">
    <div class="modal-dialog">
    
      <!-- Modal content-->
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" data-dismiss="modal">&times;</button>
          <h4 class="modal-title">Import Rooms Excel</h4>
        </div>
        <div class="modal-body">
          <p>Some text in the modal.</p>
          
          
          
          
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
        </div>
      </div>
      
    </div>
  </div>

<div class="modal fade" id="paymentModel" role="dialog" tabindex="-1" aria-labelledby="Payment Gateways" aria-hidden="true">
    <div class="modal-dialog">
    
      <!-- Modal content-->
      <div class="modal-content">

          <button type="button" class="close" data-dismiss="modal">&times;</button>
          <h4 class="modal-title">Book Room No <span id="roomNo"></span></h4>
        </div>
        <div class="modal-body">
          <p>Some text in the modal.</p>
          <input type="hidden" name="" id="roomId" value="">
          
          <table id="book-table">
	          <tbody>
		          <tr>
		          <td>Amount</td>
		          <td></td>
		          <td id="amount"></td>
		          </tr>
	          </tbody>
          </table>
          <!-- @for (let hotelPaymentGateway of hotelPaymentGatewayList; track$index){
            <a href="hotelPaymentGateway/pay?roomId=${room.roomId}&hotelPaymentGatewayId=${hotelPaymentGateway.hotelPaymentGatewayId}&amount=" role="button" class="btn btn-success">{{hotelPaymentGateway.paymentGateway.paymentGatewayName}}</a>
          } -->
          <!-- <a *ngFor="let hotelPaymentGateway of hotelPaymentGatewayList; let count = index" href="hotelPaymentGateway/pay?roomId=${room.roomId}&hotelPaymentGatewayId=${hotelPaymentGateway.hotelPaymentGatewayId}&amount=" role="button" class="btn btn-success">{{hotelPaymentGateway.paymentGateway.paymentGatewayName}}</a> -->
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">Close</button>
        </div>
      </div>
      
    </div>
  </div>


    </section>
</div>
